<button
    class="chatbot-toggle"
    mat-fab
    type="button"
    [attr.aria-label]="'chatbot.openAria' | translate"
    (click)="chatbotStore.toggle()"
>
    <mat-icon>{{ chatbotStore.isOpen() ? "close" : "chat" }}</mat-icon>
</button>

@if (chatbotStore.isOpen()) {
    <section class="chatbot-panel" [attr.aria-label]="'chatbot.panelAria' | translate">
        <header class="chatbot-panel__header">
            <div>
                <h2>{{ 'chatbot.title' | translate }}</h2>
                <p>{{ 'chatbot.subtitle' | translate }}</p>
            </div>
            <button
                mat-icon-button
                type="button"
                [attr.aria-label]="'chatbot.closeAria' | translate"
                (click)="chatbotStore.close()"
            >
                <mat-icon>close</mat-icon>
            </button>
        </header>

        <div class="chatbot-panel__messages">
            @for (message of chatbotStore.messages(); track message.id) {
                <div class="chatbot-message" [class.chatbot-message--user]="message.author === 'user'">
                    {{ message.text }}
                </div>
            }

            @if (chatbotStore.isLoading()) {
                <div class="chatbot-message">{{ 'chatbot.typing' | translate }}</div>
            }
        </div>

        <form class="chatbot-panel__form" (ngSubmit)="submitQuestion()">
            <mat-form-field appearance="outline">
                <mat-label>{{ 'chatbot.inputLabel' | translate }}</mat-label>
                <input matInput [formControl]="questionControl" />
            </mat-form-field>
            <button mat-flat-button type="submit">{{ 'chatbot.send' | translate }}</button>
        </form>
    </section>
}
