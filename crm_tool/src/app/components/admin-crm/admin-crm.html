<main class="admin-crm">
    <header class="admin-crm__header">
        <div>
            <p>Owner workspace</p>
            <h1>Patient CRM</h1>
        </div>
        <nav>
            <a mat-button routerLink="/admin/calendar">Calendar</a>
            <button mat-flat-button type="button" (click)="openCreatePatientDialog()">New patient</button>
        </nav>
    </header>

    <section class="admin-crm__table" aria-label="Patient list">
        <table mat-table [dataSource]="dataSource" matSort>
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let patient">
                    <button class="patient-link" type="button" (click)="openPatient(patient)">
                        {{ patient.name }}
                    </button>
                </td>
            </ng-container>

            <ng-container matColumnDef="lastname">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Lastname</th>
                <td mat-cell *matCellDef="let patient">{{ patient.lastname }}</td>
            </ng-container>

            <ng-container matColumnDef="phone">
                <th mat-header-cell *matHeaderCellDef>Phone number</th>
                <td mat-cell *matCellDef="let patient">{{ patient.phone }}</td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>Email</th>
                <td mat-cell *matCellDef="let patient">{{ patient.email }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <mat-paginator [pageSize]="10" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
    </section>
</main>
