<main class="admin-login">
  <section class="admin-login__panel">
    <a routerLink="/">Aster Dental</a>
    <h1>Owner login</h1>
    <p>Mock admin access for managing appointments and future calendar sync.</p>

    <form class="admin-login__form" (ngSubmit)="login()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" [formControl]="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" [formControl]="password" />
      </mat-form-field>

      <button mat-flat-button type="button" (click)="login()">Login</button>
    </form>
  </section>
</main>
